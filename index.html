<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype — Self-Modelling AI</title>
<style>
*{box-sizing:border-box}
html{height:100%;background:#050505}
body{margin:0;min-height:100%;background:#000;color:#e8e8e8;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:min(900px,100%);height:100dvh;min-height:100dvh;display:flex;flex-direction:column;background:#050505;overflow:hidden}
header{padding:14px 16px;border-bottom:1px solid #222;font-weight:650;font-size:16px;line-height:1.25;flex:0 0 auto}
.status{padding:7px 16px;color:#777;font-size:12px;line-height:1.3;border-bottom:1px solid #171717;flex:0 0 auto}\n.server-bar{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid #171717;background:#050505;flex:0 0 auto}\n.server-bar input{font-size:14px;padding:9px 11px}\n.server-bar button{min-height:40px;font-size:14px}
.chat{flex:1;min-height:0;padding:14px 12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.message{max-width:min(82%,680px);padding:11px 13px;border:1px solid #242424;border-radius:14px;background:#0d0d0d;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.message.user{align-self:flex-end;background:#151515}
.message.ai{align-self:flex-start}
.composer{display:flex;gap:8px;padding:10px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid #222;background:#050505;flex:0 0 auto}
input{flex:1;min-width:0;width:100%;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:12px;padding:11px 13px;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;outline:none}
input:focus{border-color:#666}
button{min-width:68px;min-height:44px;border:1px solid #333;background:#151515;color:#fff;border-radius:12px;padding:0 14px;font:600 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;touch-action:manipulation}
button:hover{background:#202020}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{margin:auto;text-align:center;color:#777;padding:20px;line-height:1.5}
@media (max-width:600px){
  header{padding:12px 14px;font-size:15px}
  .status{padding:6px 14px;font-size:11px}
  .server-bar{padding:7px 8px}\n  .server-bar button{min-width:72px}\n  .chat{padding:10px 9px;gap:8px}
  .message{max-width:90%;padding:10px 12px;border-radius:12px}
  .composer{gap:7px;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
  input{padding:10px 12px;border-radius:11px}
  button{min-width:64px;padding:0 12px}
}
</style>
</head>
<body>
<main class="app">
<header id="header">Prototype — Self-Modelling AI</header>
<div class="status" id="status">Satellite disconnected</div>
<div class="server-bar" id="serverBar"><input id="serverUrl" autocomplete="url" placeholder="Prototype server HTTPS URL" aria-label="Prototype server URL"><button id="connect" type="button">Connect</button></div>
<section class="chat" id="chat" aria-live="polite">
<div class="empty" id="empty">Chat area ready.<br><small>Prototype is connecting to its local runtime.</small></div>
</section>
<form class="composer" id="composer">
<input id="input" autocomplete="off" placeholder="Message Prototype…" aria-label="Message Prototype">
<button id="send" type="submit">Send</button>
</form>
</main>
<script>
const chat=document.getElementById("chat");
const empty=document.getElementById("empty");
const input=document.getElementById("input");
const send=document.getElementById("send");
const status=document.getElementById("status");
const serverUrl=document.getElementById("serverUrl");
const connect=document.getElementById("connect");
let conversationId=null;
let runtimeBase=localStorage.getItem("prototype_server_url")||"";
serverUrl.value=runtimeBase;
let busy=false;

function addMessage(text,kind){
  empty?.remove();
  const msg=document.createElement("div");
  msg.className="message "+kind;
  msg.textContent=text;
  chat.appendChild(msg);
  chat.scrollTop=chat.scrollHeight;
  return msg;
}

async function checkRuntime(){
  if(!runtimeBase){
    status.textContent="Satellite disconnected — enter the Prototype server URL";
    input.disabled=true; send.disabled=true; return;
  }
  try{
    const response=await fetch(runtimeBase+"/health",{cache:"no-store"});
    if(!response.ok) throw new Error("runtime unavailable");
    status.textContent="🟢 Prototype satellite online";
    input.disabled=false;
    send.disabled=false;
    input.focus();
  }catch(error){
    status.textContent="🔴 Satellite offline — check Codespaces server";
    input.disabled=true;
    send.disabled=true;
  }
}

document.getElementById("composer").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text||busy)return;
  busy=true;
  input.disabled=true;
  send.disabled=true;
  addMessage(text,"user");
  input.value="";
  const thinking=addMessage("Thinking…","ai");
  try{
    const response=await fetch(runtimeBase+"/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,conversation_id:conversationId})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"chat request failed");
    conversationId=data.conversation_id;
    thinking.textContent=data.reply;
    status.textContent="Prototype online · conversation "+conversationId.slice(0,8);
  }catch(error){
    thinking.textContent="I couldn't reach the Prototype runtime: "+error.message;
    status.textContent="Prototype runtime error";
  }finally{
    busy=false;
    input.disabled=false;
    send.disabled=false;
    input.focus();
  }
});

connect.addEventListener("click",()=>{
  const value=serverUrl.value.trim().replace(/\\/$/,"");
  if(!value){ status.textContent="Enter the Prototype server URL"; return; }
  try{ new URL(value); }catch{ status.textContent="That server URL is not valid"; return; }
  runtimeBase=value;
  localStorage.setItem("prototype_server_url",runtimeBase);
  conversationId=null;
  status.textContent="📡 Connecting to Prototype satellite…";
  checkRuntime();
});
serverUrl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();connect.click();}});
checkRuntime();
setInterval(checkRuntime,10000);

(async()=>{
  const reloadIfNewer=async()=>{
    try{
      const response=await fetch("generation.json?ts="+Date.now(),{cache:"no-store"});
      if(!response.ok)return;
      const state=await response.json();
      const generation=Number(state.generation);
      if(!Number.isFinite(generation))return;
      const current=Number(document.documentElement.dataset.generation ?? generation);
      if(!document.documentElement.dataset.generation){
        document.documentElement.dataset.generation=String(generation);
        document.getElementById("header").textContent="Prototype — Self-Modelling AI · Generation "+generation;
        return;
      }
      if(generation>current){
        document.documentElement.dataset.generation=String(generation);
        document.querySelectorAll("button,input").forEach(el=>el.disabled=true);
        const notice=document.createElement("div");
        notice.textContent="New Prototype generation detected. Reloading…";
        notice.style.cssText="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:600 18px system-ui;z-index:9999";
        document.body.appendChild(notice);
        setTimeout(()=>location.reload(),500);
      }
    }catch(error){
      console.warn("Generation check failed:",error);
    }
  };
  await reloadIfNewer();
  setInterval(reloadIfNewer,5000);
})();
</script>
</body>
</html>
