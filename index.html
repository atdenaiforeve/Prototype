<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype — Self-Modelling AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:#e8e8e8;font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}
.app{width:min(900px,100%);min-height:100vh;display:flex;flex-direction:column;background:#050505}
header{padding:18px 20px;border-bottom:1px solid #222;font-weight:600}
.chat{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px}
.message{max-width:80%;padding:12px 14px;border:1px solid #242424;border-radius:10px;background:#0d0d0d}
.message.user{align-self:flex-end;background:#151515}
.message.ai{align-self:flex-start}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid #222;background:#050505}
input{flex:1;min-width:0;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px;padding:12px;font:inherit;outline:none}
input:focus{border-color:#666}
button{border:1px solid #333;background:#151515;color:#fff;border-radius:8px;padding:0 18px;font:inherit;cursor:pointer}
button:hover{background:#202020}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{margin:auto;text-align:center;color:#777}
</style>
</head>
<body>
<main class="app">
<header>Prototype — Self-Modelling AI</header>
<section class="chat" id="chat" aria-live="polite">
<div class="empty" id="empty">Chat area ready.<br><small>The AI connection will be added later.</small></div>
</section>
<form class="composer" id="composer">
<input id="input" autocomplete="off" placeholder="Message Prototype…" aria-label="Message Prototype">
<button type="submit">Send</button>
</form>
</main>
<script>
const chat=document.getElementById("chat");
const empty=document.getElementById("empty");
const input=document.getElementById("input");
document.getElementById("composer").addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  empty?.remove();
  const msg=document.createElement("div");
  msg.className="message user";
  msg.textContent=text;
  chat.appendChild(msg);
  input.value="";
  input.focus();
});
</script>
</body>
</html>
