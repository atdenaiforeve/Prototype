name: Full Prototype test suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run all tests
        run: python -m unittest discover -s . -p "test_*.py" -v
