<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Prototype — Browser</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#0b0d10;color:#eee}
    h1{margin-bottom:4px}.status{color:#7dff9b}.panel{background:#15191f;border:1px solid #2b313a;border-radius:12px;padding:16px;margin:16px 0}
    #messages{min-height:220px;max-height:55vh;overflow:auto}.msg{padding:10px 12px;margin:8px 0;border-radius:8px;background:#1d232b;white-space:pre-wrap}
    .user{border-left:3px solid #6ab4ff}.prototype{border-left:3px solid #7dff9b}
    form{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:8px;border:1px solid #3a424d;background:#0e1115;color:#fff}
    button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <h1>Prototype</h1>
  <div class="status" id="status">● Browser runtime loading</div>
  <div class="panel"><strong>Prototype Identity</strong><div id="identity"></div><button id="scan-id" type="button">Scan ID</button></div>
  <div class="panel">
    <div id="messages"></div>
    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="Talk to Prototype…" required>
      <button type="submit">Send</button>
    </form>
  </div>
  <div class="panel"><strong>Runtime</strong><pre id="details">Loading…</pre></div>
  <script src="./runtime.js"></script>
  <script src="./app.js"></script>
  <script>
    document.getElementById("identity").textContent = "ID: " + prototypeId;
    document.getElementById("scan-id").addEventListener("click", () => {
      const originalId = localStorage.getItem("prototype_original_id");
      const isOriginal = originalId === prototypeId;
      document.getElementById("identity").textContent = isOriginal
        ? "ID: " + prototypeId + " — ORIGINAL ✓ — editor enabled"
        : "ID: " + prototypeId + (originalId ? " — worker — editor locked" : " — original not registered");
      updateIdentityDetails();
    });
    updateIdentityDetails();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Prototype offline cache ready"))
        .catch((error) => console.warn("Offline cache unavailable:", error));
    }
  </script>
</body>
</html>
