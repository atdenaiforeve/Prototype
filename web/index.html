<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Prototype — Browser</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#0b0d10;color:#eee}
    h1{margin-bottom:4px}.status{color:#7dff9b}.panel{background:#15191f;border:1px solid #2b313a;border-radius:12px;padding:16px;margin:16px 0}
    #messages{min-height:220px;max-height:55vh;overflow:auto}.msg{padding:10px 12px;margin:8px 0;border-radius:8px;background:#1d232b;white-space:pre-wrap}
    .user{border-left:3px solid #6ab4ff}.prototype{border-left:3px solid #7dff9b}
    form{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:8px;border:1px solid #3a424d;background:#0e1115;color:#fff}
    button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}
    .learning-grid{display:grid;gap:10px}.learning-grid input,.learning-grid textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #3a424d;background:#0e1115;color:#fff}.learning-grid textarea{min-height:90px;resize:vertical}.learning-actions{display:flex;gap:8px;flex-wrap:wrap}#learning-status{white-space:pre-wrap;color:#b7c7d8}
  </style>
</head>
<body>
  <h1>Prototype</h1>
  <div class="status" id="status">● Browser runtime loading</div>
  <div class="panel">
    <strong>Prototype Identity</strong>
    <div id="identity"></div>
    <label>Name <input id="prototype-name" maxlength="64" autocomplete="off" placeholder="Prototype"></label>
    <button id="save-name" type="button">Save name</button>
    <button id="scan-id" type="button">Scan ID</button>
    <div id="hub-status">Nordic Hub: connecting…</div>
  </div>
  <div class="panel">
    <div id="messages"></div>
    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="Talk to Prototype…" required>
      <button type="submit">Send</button>
    </form>
  </div>
  <div class="panel">
    <strong>Model Server</strong>
    <p>Optional: enter the URL of your running Prototype Python server to use the trained checkpoint. Leave blank to use the browser model.</p>
    <label>Prototype server URL <input id="learning-server" type="url" placeholder="https://your-prototype-server"></label>
    <button id="save-server" type="button">Save server URL</button>
    <div id="server-status" role="status">Browser model selected.</div>
  </div>
  <div class="panel"><strong>Runtime</strong><pre id="details">Loading…</pre></div>
  <script src="./runtime.js"></script>
  <script src="./app.js"></script>
  <script>
    document.getElementById("identity").textContent = "ID: " + prototypeId;
    const nameInput = document.getElementById("prototype-name");
    nameInput.value = localStorage.getItem("prototype_name") || "Prototype";
    document.getElementById("save-name").addEventListener("click", async () => {
      PrototypeHub.savePrototypeName(nameInput.value);
      await PrototypeHub.connect();
      nameInput.value = localStorage.getItem("prototype_name") || "Prototype";
    });
    document.getElementById("scan-id").addEventListener("click", () => {
      const originalId = localStorage.getItem("prototype_original_id");
      const isOriginal = originalId === prototypeId;
      document.getElementById("identity").textContent = isOriginal
        ? "ID: " + prototypeId + " — ORIGINAL ✓ — editor enabled"
        : "ID: " + prototypeId + (originalId ? " — worker — editor locked" : " — original not registered");
      updateIdentityDetails();
    });
    setInterval(() => {
      const hub = PrototypeHub.getState();
      const online = hub.peers.filter((peer) => peer.online).length;
      document.getElementById("hub-status").textContent =
        hub.connected
          ? "Nordic Hub: 🟢 connected — " + online + " other Prototype(s) online"
          : "Nordic Hub: 🔴 offline";
    }, 1000);

    const serverInput = document.getElementById("learning-server");
    const serverStatus = document.getElementById("server-status");
    const savedServer = localStorage.getItem("prototype_server_url") || "";
    serverInput.value = savedServer || (location.port === "8000" ? location.origin : "");

    function updateServerStatus() {
      const url = serverInput.value.trim().replace(/\/+$/, "");
      serverStatus.textContent = url
        ? "Python model selected: " + url
        : "Browser model selected.";
      updateIdentityDetails();
    }

    document.getElementById("save-server").addEventListener("click", () => {
      const url = serverInput.value.trim().replace(/\/+$/, "");
      if (url) {
        try {
          const parsed = new URL(url);
          if (!["http:", "https:"].includes(parsed.protocol)) throw new Error();
        } catch {
          serverStatus.textContent = "Enter a valid HTTP or HTTPS URL.";
          return;
        }
      }
      localStorage.setItem("prototype_server_url", url);
      serverInput.value = url;
      updateServerStatus();
    });
    serverInput.addEventListener("change", updateServerStatus);
    updateServerStatus();

    // Poll the published app assets so changes to Prototype's code refresh
    // the page even when the service-worker file itself did not change.
    const appAssets = ["./index.html", "./app.js", "./runtime.js", "./service-worker.js"];
    async function readAssetSignatures() {
      const entries = await Promise.all(appAssets.map(async path => {
        try {
          const response = await fetch(path, { cache: "no-store" });
          return [path, response.ok ? await response.text() : ""];
        } catch {
          return [path, ""];
        }
      }));
      return JSON.stringify(entries);
    }
    let lastAssetSignature = "";
    readAssetSignatures().then(signature => { lastAssetSignature = signature; });
    setInterval(async () => {
      const signature = await readAssetSignatures();
      if (!lastAssetSignature) {
        lastAssetSignature = signature;
        return;
      }
      if (signature && signature !== lastAssetSignature) {
        const messageInput = document.getElementById("message");
        if (document.activeElement === messageInput || messageInput.value.trim()) {
          return;
        }
        sessionStorage.setItem("prototype_draft", messageInput.value);
        location.reload();
      }
    }, 60_000);

    const draft = sessionStorage.getItem("prototype_draft");
    if (draft !== null) {
      document.getElementById("message").value = draft;
      sessionStorage.removeItem("prototype_draft");
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js")
        .then(registration => {
          console.log("Prototype offline cache ready");
          registration.update().catch(() => {});
          setInterval(() => registration.update().catch(() => {}), 60_000);
        })
        .catch(error => console.warn("Offline cache unavailable:", error));
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>t>
</body>
</html>
