<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Prototype — Browser</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#0b0d10;color:#eee}
    h1{margin-bottom:4px}.status{color:#7dff9b}.panel{background:#15191f;border:1px solid #2b313a;border-radius:12px;padding:16px;margin:16px 0}
    #messages{min-height:220px;max-height:55vh;overflow:auto}.msg{padding:10px 12px;margin:8px 0;border-radius:8px;background:#1d232b;white-space:pre-wrap}
    .user{border-left:3px solid #6ab4ff}.prototype{border-left:3px solid #7dff9b}
    form{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:8px;border:1px solid #3a424d;background:#0e1115;color:#fff}
    button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <h1>Prototype</h1>
  <div class="status" id="status">● Browser runtime loading</div>
  <div class="panel">
    <strong>Prototype Identity</strong>
    <div id="identity"></div>
    <label>Name <input id="prototype-name" maxlength="64" autocomplete="off" placeholder="Prototype"></label>
    <button id="save-name" type="button">Save name</button>
    <button id="scan-id" type="button">Scan ID</button>
    <div id="hub-status">Nordic Hub: connecting…</div>
  </div>
  <div class="panel">
    <div id="messages"></div>
    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="Talk to Prototype…" required>
      <button type="submit">Send</button>
    </form>
  </div>
  <div class="panel" id="learning-access">
    <strong>Teach Prototype</strong>
    <p>Enter your private learning password to add lessons. Code updates stay disabled during teaching sessions.</p>
    <form id="learning-unlock-form">
      <input id="learning-password" type="password" autocomplete="current-password" placeholder="Learning password" required>
      <button type="submit">Unlock learning</button>
    </form>
    <div id="learning-status" role="status">Learning mode locked.</div>
    <div id="learning-panel" hidden>
      <form id="teaching-form" style="display:grid;gap:8px;margin-top:12px">
        <label>Question or example <textarea id="teaching-prompt" rows="3" maxlength="2000" required style="width:100%;box-sizing:border-box"></textarea></label>
        <label>Correct answer you want Prototype to learn <textarea id="teaching-answer" rows="3" maxlength="2000" required style="width:100%;box-sizing:border-box"></textarea></label>
        <button type="submit">Save lesson</button>
      </form>
      <button id="learning-lock" type="button">Lock learning mode</button>
    </div>
  </div>
  <div class="panel"><strong>Runtime</strong><pre id="details">Loading…</pre></div>
  <script src="./runtime.js"></script>
  <script src="./app.js"></script>
  <script>
    document.getElementById("identity").textContent = "ID: " + prototypeId;
    const nameInput = document.getElementById("prototype-name");
    nameInput.value = localStorage.getItem("prototype_name") || "Prototype";
    document.getElementById("save-name").addEventListener("click", async () => {
      PrototypeHub.savePrototypeName(nameInput.value);
      await PrototypeHub.connect();
      nameInput.value = localStorage.getItem("prototype_name") || "Prototype";
    });
    document.getElementById("scan-id").addEventListener("click", () => {
      const originalId = localStorage.getItem("prototype_original_id");
      const isOriginal = originalId === prototypeId;
      document.getElementById("identity").textContent = isOriginal
        ? "ID: " + prototypeId + " — ORIGINAL ✓ — code editing disabled"
        : "ID: " + prototypeId + (originalId ? " — worker — code editing disabled" : " — original not registered");
      updateIdentityDetails();
    });
    setInterval(() => {
      const hub = PrototypeHub.getState();
      const online = hub.peers.filter((peer) => peer.online).length;
      document.getElementById("hub-status").textContent =
        hub.connected
          ? "Nordic Hub: 🟢 connected — " + online + " other Prototype(s) online"
          : "Nordic Hub: 🔴 offline";
    }, 1000);
    updateIdentityDetails();

    let learningToken = "";
    const unlockForm = document.getElementById("learning-unlock-form");
    const learningPassword = document.getElementById("learning-password");
    const learningStatus = document.getElementById("learning-status");
    const learningPanel = document.getElementById("learning-panel");
    unlockForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      learningStatus.textContent = "Checking password…";
      try {
        const response = await fetch("/learning/unlock", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password:learningPassword.value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not unlock learning mode");
        learningToken = data.token;
        learningPassword.value = "";
        learningPanel.hidden = false;
        learningStatus.textContent = "Learning mode unlocked for 30 minutes. Code editing is disabled.";
      } catch (error) { learningStatus.textContent = error.message + " (Use the Python server, not the static GitHub Pages copy.)"; }
    });
    document.getElementById("teaching-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const response = await fetch("/learning/teach", {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+learningToken}, body:JSON.stringify({prompt:document.getElementById("teaching-prompt").value,answer:document.getElementById("teaching-answer").value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not save lesson");
        learningStatus.textContent = "Lesson saved to " + data.training_file + ". " + data.note;
        document.getElementById("teaching-prompt").value = "";
        document.getElementById("teaching-answer").value = "";
      } catch (error) { learningStatus.textContent = error.message; }
    });
    document.getElementById("learning-lock").addEventListener("click", async () => {
      try { await fetch("/learning/lock", {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+learningToken}, body:"{}"}); }
      finally { learningToken = ""; learningPanel.hidden = true; learningStatus.textContent = "Learning mode locked. Code editing remains disabled."; }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Prototype offline cache ready"))
        .catch((error) => console.warn("Offline cache unavailable:", error));
    }
  </script>
</body>
</html>
